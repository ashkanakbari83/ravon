name: Build Android APK

# Manual only — this builds a sideloadable APK (TWA wrapper around the
# deployed PWA), not something we need on every push. Run it from the
# Actions tab (or `gh workflow run android-apk.yml`) whenever a new APK is
# needed for distribution outside Google Play.
on:
  workflow_dispatch:
    inputs:
      app_version_code:
        description: 'Override the numeric Android version code (optional)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        # ubuntu-latest runners already ship an Android SDK with licenses
        # pre-accepted. (android-actions/setup-android tries to install the
        # long-removed legacy "tools" package and fails on current SDK
        # versions, so we drive sdkmanager directly instead.)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "SDK_ROOT=$SDK_ROOT"
          echo "Using $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Generate TWA (Android) project + signing key
        env:
          APP_VERSION_CODE: ${{ inputs.app_version_code }}
        run: npm run android:generate

      - name: Build release APK (unsigned)
        working-directory: android/project
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        run: npm run android:sign

      - name: Upload APK + signing key
        uses: actions/upload-artifact@v4
        with:
          name: ravon-apk
          path: |
            android/ravon.apk
            android/ravon-release.keystore
            android/keystore-credentials.txt
          retention-days: 14
